name: Backend - Build, Package & Deploy

on:
  push:
    branches:
      - V5
    paths:
      - "backend/**"
      - "infra/deploy_script/build.sh"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FUNCTION_PREFIX: GRP05-
      ARTIFACT_BUCKET: grp05-claims-evidence-620560406466

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Verify AWS identity and S3 access
        run: |
          echo "==> AWS identity"
          aws sts get-caller-identity

          echo "==> Test S3 write access"
          echo "GitHub Actions S3 test" > /tmp/github-actions-s3-test.txt

          aws s3 cp \
            /tmp/github-actions-s3-test.txt \
            "s3://${ARTIFACT_BUCKET}/v5/backend/test/github-actions-s3-test.txt"

          aws s3 rm \
            "s3://${ARTIFACT_BUCKET}/v5/backend/test/github-actions-s3-test.txt"

      - name: Build Lambda functions
        run: |
          chmod +x infra/deploy_script/build.sh
          bash infra/deploy_script/build.sh

      - name: Package Lambda functions
        run: |
          mkdir -p artifacts

          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            echo "==> Packaging $FUNCTION"

            cd "build/$FUNCTION"
            zip -qr "../../artifacts/${FUNCTION}.zip" .
            cd ../..
          done

          echo "==> Generated artifacts:"
          ls -lh artifacts/

      - name: Upload deployment artifacts to S3
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "==> Uploading artifacts for commit $COMMIT_SHA"

          for FILE in artifacts/*.zip; do
            aws s3 cp "$FILE" \
              "s3://${ARTIFACT_BUCKET}/v5/backend/${COMMIT_SHA}/$(basename "$FILE")"
          done

      - name: Verify S3 artifacts
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "==> Verifying deployment artifacts"

          aws s3 ls \
            "s3://${ARTIFACT_BUCKET}/v5/backend/${COMMIT_SHA}/" \
            --human-readable

      - name: Deploy Lambda functions
        run: |
          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            LAMBDA_NAME="${FUNCTION_PREFIX}${FUNCTION}"

            echo "==> Deploying $LAMBDA_NAME"

            aws lambda update-function-code \
              --function-name "$LAMBDA_NAME" \
              --zip-file "fileb://artifacts/${FUNCTION}.zip" \
              --publish

            aws lambda wait function-updated \
              --function-name "$LAMBDA_NAME"
          done

      - name: Verify Lambda deployment
        run: |
          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            LAMBDA_NAME="${FUNCTION_PREFIX}${FUNCTION}"

            echo "==> Verifying $LAMBDA_NAME"

            aws lambda get-function \
              --function-name "$LAMBDA_NAME" \
              --query 'Configuration.[FunctionName,State,LastUpdateStatus]' \
              --output table
          done
