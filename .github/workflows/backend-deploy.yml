name: Backend - Build, Package & Deploy

on:
  push:
    branches:
      - V5
    paths:
      - "backend/**"
      - "infra/deploy_script/build.sh"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FUNCTION_PREFIX: GRP05-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Build Lambda functions
        run: |
          chmod +x infra/deploy_script/build.sh
          bash infra/deploy_script/build.sh

      - name: Package Lambda functions
        run: |
          mkdir -p artifacts

          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            echo "==> Packaging $FUNCTION"

            cd "build/$FUNCTION"
            zip -qr "../../artifacts/${FUNCTION}.zip" .
            cd ../..
          done

          echo "==> Generated artifacts:"
          ls -lh artifacts/

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-lambda-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Verify deployment artifacts
        run: |
          echo "==> Verifying deployment artifacts"

          EXPECTED_FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
          )

          for FUNCTION in "${EXPECTED_FUNCTIONS[@]}"; do
            FILE="artifacts/${FUNCTION}.zip"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing artifact $FILE"
              exit 1
            fi

            echo "✓ Found $FILE"
          done

          echo "==> All Lambda deployment artifacts verified"

      - name: Deploy Lambda functions
        run: |
          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            LAMBDA_NAME="${FUNCTION_PREFIX}${FUNCTION}"

            echo "==> Deploying $LAMBDA_NAME"

            aws lambda update-function-code \
              --function-name "$LAMBDA_NAME" \
              --zip-file "fileb://artifacts/${FUNCTION}.zip" \
              --publish

            aws lambda wait function-updated \
              --function-name "$LAMBDA_NAME"
          done

      - name: Verify Lambda deployment
        run: |
          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            LAMBDA_NAME="${FUNCTION_PREFIX}${FUNCTION}"

            echo "==> Verifying $LAMBDA_NAME"

            aws lambda get-function \
              --function-name "$LAMBDA_NAME" \
              --query 'Configuration.[FunctionName,State,LastUpdateStatus]' \
              --output table
          done
