name: Backend - Build & Deploy

on:
  push:
    branches:
      - V5
    paths:
      - "backend/**"
      - "infra/deploy_script/build.sh"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      FUNCTION_PREFIX: GRP05-test-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity

      - name: Build Lambda functions
        run: |
          chmod +x infra/deploy_script/build.sh
          bash infra/deploy_script/build.sh

      - name: Package Lambda functions
        run: |
          mkdir -p artifacts

          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
            "migrate"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            echo "==> Packaging $FUNCTION"
            cd "build/$FUNCTION"
            zip -qr "../../artifacts/${FUNCTION}.zip" .
            cd ../..
          done

      - name: Deploy Lambda functions
        run: |
          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
            "migrate"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            LAMBDA_NAME="${FUNCTION_PREFIX}ClaimMigrate"

            if [ "$FUNCTION" != "migrate" ]; then
              LAMBDA_NAME="${FUNCTION_PREFIX}${FUNCTION}"
            fi

            echo "==> Deploying $LAMBDA_NAME"

            aws lambda update-function-code \
              --function-name "$LAMBDA_NAME" \
              --zip-file "fileb://artifacts/${FUNCTION}.zip" \
              --publish
            aws lambda wait function-updated \
              --function-name "$LAMBDA_NAME"
          done

      - name: Verify Lambda deployment
        run: |
          FUNCTIONS=(
            "ClaimCRUDUser"
            "ClaimsPeriodTermCourses"
            "ClaimUserRequest"
            "ClaimWorkflowAPI"
            "ClaimEvidencePresign"
            "ClaimEvidenceAPI"
            "ClaimAdminMasterData"
            "migrate"
          )

          for FUNCTION in "${FUNCTIONS[@]}"; do
            LAMBDA_NAME="${FUNCTION_PREFIX}ClaimMigrate"

            if [ "$FUNCTION" != "migrate" ]; then
              LAMBDA_NAME="${FUNCTION_PREFIX}${FUNCTION}"
            fi

            echo "==> Verifying $LAMBDA_NAME"

            aws lambda get-function \
              --function-name "$LAMBDA_NAME" \
              --query 'Configuration.[FunctionName,State,LastUpdateStatus]' \
              --output table
          done
