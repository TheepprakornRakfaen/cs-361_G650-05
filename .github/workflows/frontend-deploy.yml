      #   run: |
      #     aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
      #       --delete \
      #       --cache-control "public, max-age=31536000, immutable" \
      #       --exclude "index.html"
      #     aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
      #       --cache-control "no-cache, no-store, must-revalidate"
