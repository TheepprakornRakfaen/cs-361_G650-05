name: Frontend – Build & Deploy

# ========================================================
# V5 – Automation / Infrastructure as Code
# CI/CD pipeline สำหรับ frontend (React + Vite)
# ทำงานอัตโนมัติทุกครั้งที่มีการ push ไปยัง branch ที่กำหนด
# ไม่ต้องตั้งค่าหรือ deploy ด้วยมือ ลด Manual Configuration
# และความคลาดเคลื่อนจากการตั้งค่าซ้ำในแต่ละ environment
# ========================================================

on:
  push:
    branches:
      - main        # Production deployment
      - V4          # Staging deployment
      - V5          # Development deployment
    paths:
      - "teaching-claim-system/**"
      - ".github/workflows/frontend-deploy.yml"

  pull_request:
    branches:
      - main
    paths:
      - "teaching-claim-system/**"

# หยุด job เก่าทันทีเมื่อมี push ใหม่มาในรอบเดียวกัน (ประหยัด build minutes)
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Build — ตรวจสอบโค้ด + build artifact
  # ============================================================
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: teaching-claim-system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: teaching-claim-system/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      # --------------------------------------------------------
      # กำหนด environment variable ตาม branch อัตโนมัติ
      # ไม่ต้องแก้ไฟล์ .env ด้วยมือในแต่ละ environment
      # --------------------------------------------------------
      - name: Set environment (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "VITE_ENV=production" >> .env.production.local
          echo "VITE_API_URL=${{ secrets.PROD_API_URL }}" >> .env.production.local
          echo "VITE_COGNITO_USER_POOL_ID=${{ secrets.PROD_COGNITO_POOL_ID }}" >> .env.production.local
          echo "VITE_COGNITO_CLIENT_ID=${{ secrets.PROD_COGNITO_CLIENT_ID }}" >> .env.production.local

      - name: Set environment (Staging / V4)
        if: github.ref == 'refs/heads/V4'
        run: |
          echo "VITE_ENV=staging" >> .env.production.local
          echo "VITE_API_URL=${{ secrets.STAGING_API_URL }}" >> .env.production.local
          echo "VITE_COGNITO_USER_POOL_ID=${{ secrets.STAGING_COGNITO_POOL_ID }}" >> .env.production.local
          echo "VITE_COGNITO_CLIENT_ID=${{ secrets.STAGING_COGNITO_CLIENT_ID }}" >> .env.production.local
          echo "VITE_DEV_AUTH_BYPASS=true" >> .env.production.local

      - name: Set environment (Development / V5)
        if: github.ref == 'refs/heads/V5'
        run: |
          echo "VITE_ENV=development" >> .env.production.local
          echo "VITE_DEV_AUTH_BYPASS=true" >> .env.production.local

      - name: Build
        run: npm run build

      # เก็บ artifact ไว้ให้ deploy job ดึงไปใช้
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: teaching-claim-system/dist/
          retention-days: 7

  # ============================================================
  # JOB 2: Deploy to AWS Amplify / S3+CloudFront
  # รันเฉพาะ push (ไม่รัน pull_request)
  # ============================================================
  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    # Environment context แยกตาม branch (secret แยกกัน)
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # ตัวเลือก A: AWS Amplify (แนะนำสำหรับ V1/V2)
      # ตัวเลือก B: S3 + CloudFront invalidation (Production)
      # ปลดหมายเหตุตัวที่ต้องการใช้
      # --------------------------------------------------------

      # --- ตัวเลือก A: Amplify ---
      - name: Deploy to Amplify
        run: |
          aws amplify start-deployment \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name ${{ github.ref_name }} \
            --source-url "s3://${{ secrets.BUILD_BUCKET }}/frontend-${{ github.sha }}.zip"

      # # --- ตัวเลือก B: S3 + CloudFront ---
